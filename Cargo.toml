[package]
name = "hpd-v2"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rmk = { version = "=0.9.0", features = ["split", "rp2040"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-rp = { version = "0.10", features = ["rp2040", "defmt", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-futures = { version = "0.1", features = ["defmt"] }
cortex-m-rt = "0.7.5"
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
lto = "fat"
