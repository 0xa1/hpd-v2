[keyboard]
name = "HPD v2"
product_name = "HPD v2"
manufacturer = "Handwired"
vendor_id = 0x4c4b
product_id = 0x4643
chip = "rp2040"

[host]
vial_enabled = true
rynk_enabled = false
# Both keys are on the right: the first and last keys of the top row.
unlock_keys = [[5, 5], [5, 0]]

[storage]
enabled = true
# Flash offset; memory.x keeps the application below this address.
start_addr = 0x100000

[layout]
rows = 10
cols = 6
# Top view. The right half is central, but keeps the HPD v1 matrix addresses.
map = """
(0,0,@outer) (0,1,@pinky) (0,2,@ring) (0,3) (0,4,@ring) (0,5,@pinky) [6] (5,5,@pinky) (5,4,@ring) (5,3) (5,2,@ring) (5,1,@pinky) (5,0,@outer)
(1,0,@outer) (1,1,@pinky) (1,2,@ring) (1,3) (1,4,@ring) (1,5,@pinky) [6] (6,5,@pinky) (6,4,@ring) (6,3) (6,2,@ring) (6,1,@pinky) (6,0,@outer)
(2,0,@outer) (2,1,@pinky) (2,2,@ring) (2,3) (2,4,@ring) (2,5,@pinky) [6] (7,5,@pinky) (7,4,@ring) (7,3) (7,2,@ring) (7,1,@pinky) (7,0,@outer)
(3,0,@outer) (3,1,@pinky) (3,2,@ring) (3,3) (3,4,@ring) (3,5,@pinky) [6] (8,5,@pinky) (8,4,@ring) (8,3) (8,2,@ring) (8,1,@pinky) (8,0,@outer)
[2] (4,2,@ring) (4,3) (4,4,@ring) (4,5,@pinky) (4,0,@thumb) (4,1,@thumb_tip) [2] (9,1,@thumb_tip) (9,0,@thumb) (9,5,@pinky) (9,4,@ring) (9,3) (9,2,@ring)
"""

[layout.shapes]
outer = { y = 0.50 }
pinky = { y = 0.30 }
ring = { y = 0.15 }
thumb = { y = 0.55 }
thumb_tip = { y = 1.15 }

[keymap]
layers = 16

# 0: base, with the two thumb keys tapping Space/Enter or holding layers 1/2.
[[keymap.layer]]
keys = """
Grave   Kc1    Kc2    Kc3    Kc4           Kc5       Kc6     Kc7       Kc8       Kc9          Kc0       Backspace
Escape  Q      W      E      R             T         Y       U         I         O            P         LeftBracket
Tab     A      S      D      F             G         H       J         K         L            Semicolon Quote
LShift  Z      X      C      V             B         N       M         Comma     Dot          Slash     RShift
PageDown PageUp LGui  LCtrl  LT(1,Space)   LAlt      RAlt    LT(2,Enter) RCtrl   RGui         Backslash RightBracket
"""

# 1: functions, navigation, and digits.
[[keymap.layer]]
keys = """
F1      F2     F3              F4          F5               F6      F7           F8    F9    F10   F11  F12
_       _      Home            Up          End              Insert  _            Kc7   Kc8   Kc9   _    _
_       _      Left            Down        Right            _       _            Kc4   Kc5   Kc6   _    _
_       _      WM(Left,LCtrl)  CapsLock    WM(Right,LCtrl)  Delete  PrintScreen  Kc1   Kc2   Kc3   _    _
_       Application _          _           _                _       _            MO(3) _     _     Kc0  _
"""

# 2: symbols and Alt+function keys.
[[keymap.layer]]
keys = """
WM(F1,LAlt) WM(F2,LAlt) WM(F3,LAlt)   WM(F4,LAlt)       WM(F5,LAlt)    WM(F6,LAlt)    WM(F7,LAlt)  WM(F8,LAlt)       WM(F9,LAlt)    WM(F10,LAlt)          WM(F11,LAlt) WM(F12,LAlt)
_           _           SHIFTED(Comma) Equal           SHIFTED(Dot)   Grave          _            LeftBracket      SHIFTED(Equal) RightBracket         _            _
_           Backslash   SHIFTED(Kc9)  Minus            SHIFTED(Kc0)    SHIFTED(Equal) SHIFTED(Kc5) SHIFTED(LeftBracket) SHIFTED(Minus) SHIFTED(RightBracket) SHIFTED(Kc1) _
_           _           WM(Left,LGui) SHIFTED(Semicolon) WM(Right,LGui) _             _            SHIFTED(Backslash) SHIFTED(Grave) SHIFTED(Kc7)         _            _
_           _           _             _                 MO(3)          _             _            _                  _              _                    _            _
"""

# 3: one-shot modifiers, media, and bootloader. Six QMK-only actions are disabled.
[[keymap.layer]]
keys = """
Bootloader _         _         _          _           _   _  _               _               _               _   _
_          _         _         _          _           _   _  _               _               _               No  No
_          OSM(LGui) OSM(LAlt) OSM(LCtrl) OSM(LShift) No  _  AudioVolDown    AudioMute       AudioVolUp      No  No
_          _         _         _          _           _   _  MediaPrevTrack  MediaPlayPause  MediaNextTrack  _   No
_          _         _         _          _           _   _  _               _               _               _   _
"""

[behavior.one_shot]
timeout = "5s"

[behavior.morse]
hold_timeout = "200ms"
gap_timeout = "200ms"
# Preserve the old profile's unbound Tap Dance slot 0.
morses = [{ hold = "MO(1)", double_tap = "OSL(1)", hold_after_tap = "MO(1)", profile = "tap_dance_slot_0" }]

[behavior.morse.profiles]
# Vial reads the slot's own timeout, not the global fallback.
tap_dance_slot_0 = { hold_timeout = "200ms", gap_timeout = "200ms" }

[split]
connection = "serial"

[split.central]
rows = 5
cols = 6
row_offset = 5
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["PIN_6", "PIN_5", "PIN_4", "PIN_3", "PIN_2"]
col_pins = ["PIN_7", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_28"]
bootmagic = [0, 0]

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["PIN_6", "PIN_5", "PIN_4", "PIN_3", "PIN_2"]
col_pins = ["PIN_7", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_28"]
bootmagic = [0, 0]
